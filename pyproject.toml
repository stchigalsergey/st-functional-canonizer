[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "st-functional-canonizer"
version = "0.2.0"
description = "Research canonizer and typed-signature induction for IEC 61131-3 Structured Text"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Sergey Evgenievich Shchigal"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/stchigalsergey/st-functional-canonizer"

[project.scripts]
st-signature-induction = "st_signature_induction:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["st_canonizer", "st_canonizer_v2", "st_signature_induction"]
